services:
  - type: web
    name: live-bet-verifier
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./verifier.db